name: claudart_lints
description: Custom analyzer lints enforcing paradigms from dartrix's PARADIGMS.md — bare_string_for_enum, enum_values_loop_in_single_test, ungrouped_identical_switch_cases.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <5.0.0'

dependencies:
  analyzer: ^8.1.1
  analyzer_plugin: ^0.13.7
  custom_lint_builder: ^0.8.1
